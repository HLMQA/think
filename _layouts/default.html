<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  {% include nav.html %}
  <main class="page">
    {{ content }}
  </main>
  <footer class="footer">
    <span>think lab · Department of Media Studies, University of Amsterdam</span>
    <span class="contact">Contact: <a class="email" data-u="{{ site.contact.user | split: '' | reverse | join: '' }}" data-d="{{ site.contact.domain | split: '' | reverse | join: '' }}">{{ site.contact.user }} [at] {{ site.contact.domain | replace: '.', ' [dot] ' }}</a></span>
  </footer>
  <script>
    // Assemble the address in the browser so it never appears whole in the page source.
    document.querySelectorAll("a.email").forEach(function (a) {
      var rev = function (s) { return s.split("").reverse().join(""); };
      var addr = rev(a.dataset.u) + "\u0040" + rev(a.dataset.d);
      a.textContent = addr;
      a.href = "mail" + "to:" + addr;
    });
  </script>
</body>
</html>
